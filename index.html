<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スペイン語・既習単語検索</title>
<style>
:root { color-scheme: light; --ink:#20242b; --muted:#667085; --line:#d9dee7; --blue:#2457c5; --bg:#f5f7fb; }
* { box-sizing:border-box; }
body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:var(--bg); }
main { max-width:900px; margin:32px auto; padding:0 18px; display:none; }
#gate { max-width:420px; margin:12vh auto; padding:24px; background:white; border:1px solid var(--line); border-radius:14px; box-shadow:0 3px 14px #172b4d0b; }
#gate h2 { margin:0 0 8px; font-size:21px; }
#gate p { margin:0 0 16px; }
#gateInput { width:100%; margin-bottom:10px; }
#gateButton { width:100%; min-height:46px; }
#gateStatus { min-height:24px; margin-top:10px; color:#b42318; font-size:14px; }
h1 { font-size:24px; margin:0 0 8px; }
p { color:var(--muted); margin:0 0 18px; line-height:1.6; }
.panel { background:white; border:1px solid var(--line); border-radius:14px; padding:20px; box-shadow:0 3px 14px #172b4d0b; }
label { display:block; font-weight:650; margin-bottom:8px; }
.searchrow { display:flex; gap:8px; }
input { flex:1; min-width:0; padding:14px 15px; border:1px solid #aeb8c8; border-radius:9px; font-size:18px; outline:none; }
input:focus { border-color:var(--blue); box-shadow:0 0 0 3px #2457c522; }
button { border:0; background:var(--blue); color:white; font-weight:650; padding:0 20px; border-radius:9px; cursor:pointer; font-size:15px; }
button.secondary { background:#e9edf5; color:#263246; }
#status { margin:14px 0 0; font-weight:650; min-height:26px; }
.hit { color:#147044; }
.miss { color:#b54708; }
.small { font-size:13px; color:var(--muted); margin-top:8px; }
details { margin-top:18px; }
summary { cursor:pointer; font-weight:650; }
#list { margin-top:12px; padding:12px; max-height:380px; overflow:auto; border:1px solid var(--line); border-radius:8px; background:#fbfcfe; white-space:pre-wrap; overflow-wrap:anywhere; font:14px/1.55 ui-monospace,Consolas,monospace; }
mark { background:#ffeb8a; color:#20242b; border-radius:3px; padding:0 1px; }
.footer { margin-top:14px; display:flex; gap:8px; flex-wrap:wrap; }
@media(max-width:560px){ .searchrow{flex-direction:column} button{padding:13px} }
</style>
</head>
<body>
<section id="gate" aria-label="入場キー">
  <h2>入場キーを入力</h2>
  <p>利用するには入場キーが必要です。</p>
  <input id="gateInput" type="password" inputmode="numeric" placeholder="入場キー" autocomplete="off">
  <button id="gateButton" type="button">入場</button>
  <div id="gateStatus" aria-live="polite"></div>
</section>
<main>
  <h1>スペイン語・既習単語検索</h1>
  <p>本を読んでいて出会った単語を入力すると、アップロードされた既習単語リストに含まれているか検索します。</p>
  <section class="panel">
    <label for="word">調べたいスペイン語</label>
    <div class="searchrow">
      <input id="word" type="search" placeholder="例：abandonar" autocomplete="off">
      <button id="search">検索</button>
      <button id="clear" class="secondary" type="button">クリア</button>
    </div>
    <div id="status" aria-live="polite">単語を入力してください。</div>
    <div class="small">Enter または Ctrl + F で検索欄に移動できます。アクセント記号・大文字小文字の違いは無視して検索します。</div>
  </section>
  <details>
    <summary>既習単語リストを表示</summary>
    <div id="list"></div>
  </details>
  <div class="footer">
    <button id="showall" class="secondary" type="button">リストをすべて表示</button>
  </div>
</main>

    const safe = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp(safe, 'giu');
    list.innerHTML = matches.map(line => escapeHtml(line).replace(re, m => `<mark>${escapeHtml(m)}</mark>`)).join('\n');
  } else {
    status.textContent = '既習リストには見つかりませんでした（未学習の可能性があります）。';
    status.className = 'miss';
    details.open = false;
    list.textContent = '';
  }
}
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
document.getElementById('search').addEventListener('click', search);
input.addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
document.getElementById('clear').addEventListener('click', () => {
  input.value=''; status.textContent='単語を入力してください。'; status.className=''; list.textContent=''; input.focus();
});
document.getElementById('showall').addEventListener('click', () => {
  details.open = true; list.textContent = vocabulary;
});
document.addEventListener('keydown', e => {
  if (main.style.display !== 'none' && (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') {
    e.preventDefault(); input.focus(); input.select();
  }
});
</script>
</body>
